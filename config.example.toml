# Copy to ~/.config/gitdrift/config.toml

roots = ["~/gitlab"]

# Replaces the built-in prune list.
# prune = [".terragrunt-cache", "node_modules"]

# Appends to the built-in prune list.
prune_extra = []

# Unset: $VISUAL, then $EDITOR, then vi.
# editor = "nvim"

# Simultaneous `git fetch` processes when fetching all repositories.
fetch_concurrency = 16

# Branch names treated as unremarkable. Anything else renders in bold so an
# unusual checkout stands out.
# default_branches = ["main", "master", "trunk", "develop"]
